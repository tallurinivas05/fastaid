<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FastAid — Smart Ambulance Demo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="device">
    <header class="topbar">
      <div class="brand"><span>🚑</span><strong>FAST<span>AID</span></strong><span class="drop">💧</span></div>
      <button id="resetBtn" class="reset">Reset Demo</button>
    </header>

    <main>
      <section id="home" class="screen">
        <div class="hero">
          <div class="logo">🚑 💧</div>
          <h1>FAST<span>AID</span></h1>
          <p>Emergency coordination demo</p>
          <div class="demo-pill">● DEMO MODE</div>
        </div>
        <div class="roles">
          <button class="role" data-role="user"><div>👤</div><h2>USER</h2><p>Book an ambulance instantly</p></button>
          <button class="role" data-role="captain"><div>🚑</div><h2>CAPTAIN</h2><p>Receive & manage emergency trips</p></button>
          <button class="role" data-role="hospital"><div>🏥</div><h2>HOSPITAL</h2><p>Ambulance arrivals</p></button>
        </div>
      </section>

      <section id="app" class="screen hidden">
        <div class="apphead">
          <button id="backBtn" class="back">←</button>
          <div class="brand small"><strong>FAST<span>AID</span></strong></div>
          <div class="demo-pill">● DEMO</div>
        </div>

        <section id="userView" class="view hidden"></section>
        <section id="captainView" class="view hidden"></section>
        <section id="hospitalView" class="view hidden"></section>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
